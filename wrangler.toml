# Local development only (npx wrangler dev). Production/staging configs are generated
# by scripts/deploy.mjs as wrangler.<env>.toml with the real database ID.
name = "noviqtek-school-dev"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "noviqtek-school-dev"
database_id = "a2f9905e-9f96-4255-8362-36a1f067670e"
migrations_dir = "migrations"

[vars]
APP_ENV = "development"
